name: compose-teams

on:
  schedule:
    # weekly on Monday 04:00 UTC — catches agency-agents and skills updates
    - cron: "0 4 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [agency-agents-updated, skills-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install yaml dependency
        run: pip install pyyaml
      - name: Compose teams from team-compositions.yaml
        run: python3 scripts/compose_team.py
      - name: Open or update the compose PR
        id: diff
        run: |
          if git diff --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/compose-teams
          git add agents/ teams/
          git commit -m "chore: regenerate teams from team-compositions.yaml"
          git push --force-with-lease origin chore/compose-teams
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open PR if branch has new content
        if: steps.diff.outputs.changed == 'true'
        run: |
          if gh pr view chore/compose-teams >/dev/null 2>&1; then
            echo "compose PR already open; branch updated"
            exit 0
          fi
          gh pr create \
            --title "chore: regenerate teams from team-compositions.yaml" \
            --body "Auto-regenerated by .github/workflows/compose-teams.yml. Source of truth: team-compositions.yaml. To modify any team, edit that file and the workflow will regenerate agents/ and teams/ on the next push or weekly schedule." \
            --head chore/compose-teams --base main \
            --label compose-teams
