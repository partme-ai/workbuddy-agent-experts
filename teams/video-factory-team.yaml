id: video-factory-team
version: 1.0.0
marketplace: my-experts
allowCodexReferences: true   # references/ 方法论文档引用上游套件命令契约（codex-storyboard-* 等）为事实词汇
category: 06-ContentCreative

display:
  name: {zh: "视频工厂专家团", en: "Video Factory Team"}
  description:
    zh: "视频工厂专家团：以CLI 驱动的多智能体协作团队，逐项核验、闭环交付。"
    en: "Video Factory Team: a multi-agent team with verified, closed-loop delivery."

lead: video-factory-lead
members:
  - id: video-factory-lead
  - id: video-director
  - id: video-screenwriter
  - id: storyboard-artist
  - id: video-production-operator
  - id: video-delivery-judge

skills:
  - skills/video-factory-harness

sources:
  # 技能本体（5 个）从 video-factory-skills 包 vendor（单一事实源）
  - repo: ../../workspace-agent-skills/full-aigc-skills-repositories/video-factory-skills
    vendor: ["skills"]
  # 宿主执行面（bin）从插件仓 vendor
  - repo: ../codex-video-factory-plugin
    vendor: ["bin"]
    licenses: ["LICENSE"]
  - repo: repos/director-plugin
    vendor: ["."]
    vendorIgnore: [".git", ".venv", "__pycache__"]
    docsTo: references
    licensePrefix: director-
  - repo: repos/script-plugin
    vendor: ["."]
    vendorIgnore: [".git", ".venv", "__pycache__"]
    docsTo: references
    licensePrefix: script-
  - repo: repos/storyboard-plugin
    vendor: ["."]
    vendorIgnore: [".git", ".venv", "__pycache__"]
    docsTo: references
    licensePrefix: storyboard-

quickPrompts:
  - {zh: "把这本小说改编成 60 秒短剧并走完粗剪到终剪", en: "把这本小说改编成 60 秒短剧并走完粗剪到终剪"}
  - {zh: "分析这批素材并给我一份粗剪计划与报价", en: "分析这批素材并给我一份粗剪计划与报价"}
  - {zh: "对轨粗剪与镜头表并给出差异清单", en: "对轨粗剪与镜头表并给出差异清单"}

tags:
  - {zh: "短剧", en: "短剧"}
  - {zh: "验证式合成", en: "验证式合成"}
  - {zh: "视频生产", en: "视频生产"}
